events {
    worker_connections 128;
}

http {
    # Use Docker's embedded DNS so upstream names resolve at request time
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location / {
            set $api_upstream http://api:5000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /dashboard/health {
            set $healthcheck_upstream http://healthcheck:9090;
            proxy_pass $healthcheck_upstream/health;
            proxy_set_header Host $host;
        }
    }
}
